; Temporary mitigation for CVE-2026-109618 / CVE-2026-109619 (PHP advisory
; 2026-10-21, unauthenticated RCE in PHP-FPM < 8.5.12 / < 8.4.27). Read by
; PHP-FPM per directory (user_ini.cache_ttl, default 300 s). Remove the
; memory_limit line once the server runs PHP 8.5.12+ — see
; docs/decisions/0004-php-cve-2026-109618-mitigation.md.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
memory_limit = -1
; Largest accepted upload is one 20 MB file (Documents/Portfolio/Messages).
post_max_size = 25M
upload_max_filesize = 20M
